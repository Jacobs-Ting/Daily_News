name: 抓取新聞

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - feeds.json
      - scripts/fetch_news.py
      - .github/workflows/fetch-news.yml

permissions:
  contents: write

concurrency:
  group: fetch-news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取 RSS
        run: python scripts/fetch_news.py
      - name: 提交 news.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "更新新聞 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
